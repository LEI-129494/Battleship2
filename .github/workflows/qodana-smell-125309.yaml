# 125309 - Diogo Miranda

name: Qodana Long Parameter List

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # DEBUG - remover quando funcionar
      - name: Debug files
        run: |
          pwd
          ls -la
          find . -name "*125309*"

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config=./qodana-125309.yaml
          use-annotations: true
          post-pr-comment: true