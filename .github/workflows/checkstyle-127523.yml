
# 127523 - Diego Costa
name: Checkstyle ConstantName 127523

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle ConstantName
        run: |
          mvn -B org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check \
            -Dcheckstyle.config.location=Checkstyle/checkstyle-127523.xml \
            -Dcheckstyle.consoleOutput=true \
            -Dcheckstyle.failOnViolation=true
