# ============================================================
# Battleship2 - Mensagens em Portugues (idioma por omissao)
# ============================================================
# Convencoes:
#   - Chaves em minusculas, hierarquicas, separadas por ponto.
#   - Plurais usam MessageFormat ICU: {count, plural, one {...} other {...}}
#   - Placeholders: {0}, {1} (posicionais) ou {count}, {type}, {typePlural} (nomeados).
#   - Aspas simples literais escrevem-se '' (duas).
# ============================================================

# --- Aplicacao ---
app.title=***  Battleship  ***

# --- Comandos do menu (o utilizador escreve estes valores) ---
cmd.help=ajuda
cmd.newfleet=gerafrota
cmd.loadfleet=lefrota
cmd.status=estado
cmd.map=mapa
cmd.shot=rajada
cmd.shots=tiros
cmd.simulate=simula
cmd.simulate=simula
cmd.exportpdf=exportapdf
cmd.quit=desisto

# --- Menu: ajuda ---
menu.prompt=> 
menu.help.title======================== AJUDA DO MENU =========================
menu.help.intro=Digite um dos comandos abaixo para interagir com o jogo:
menu.help.help=- {0}: Mostra esta ajuda.
menu.help.newfleet=- {0}: Gera uma frota aleatoria de navios.
menu.help.loadfleet=- {0}: Permite criar e carregar uma frota personalizada.
menu.help.status=- {0}: Mostra o status atual da frota.
menu.help.map=- {0}: Exibe o mapa da frota.
menu.help.shot=- {0}: Realiza uma rajada de disparos.
menu.help.simulate=- {0}: Simula um jogo completo.
menu.help.shots=- {0}: Lista os tiros validos realizados (* = tiro em navio, o = tiro na agua).
menu.help.shots=- {0}: Lista os tiros validos realizados (* = tiro em navio, o = tiro na agua).
menu.help.exportpdf=- {0}: Exporta o historico de jogadas para PDF.
menu.help.quit=- {0}: Encerra o jogo.
menu.help.footer================================================================

# --- Mensagens gerais ---
msg.goodbye=Bons ventos!
msg.unknownCommand=Que comando e esse??? Repete ...
msg.unknownShip=Navio desconhecido!
msg.shipAddFailure=Falha na criacao de {0} {1} {2}
msg.shipsAdded={0} navios adicionados com sucesso!
msg.pdfExported=PDF gerado em: {0}
msg.noActiveGame=Nao ha nenhuma partida ativa. Crie uma frota primeiro.

# --- Erros de input ---
error.incompletePosition=Posicao incompleta! A coluna ''{0}'' nao e seguida por uma linha.
error.invalidPositionCount=Deve inserir exactamente {0} posicoes!
error.noValidPosition=Nenhuma posicao valida encontrada!
error.invalidPositionFormat=Formato invalido. Use ''A3'', ''A 3'' ou similar.
error.mustFireExactly=Deve disparar exactamente {0} tiros por jogada.
error.jsonSerialization=Erro ao serializar o JSON
error.jsonMoveSerialization=Erro ao serializar o JSON dos resultados da jogada
error.pdfExport=Erro ao gerar o ficheiro PDF.
# --- Tabuleiro: legenda ---
board.legend.title=          LEGENDA
board.legend.symbols=''{0}''->navio, ''{1}''->adjacente a navio, ''{2}''->agua
board.legend.shots=''{0}''->Tiro certeiro, ''{1}''->Tiro na agua

# --- Tiro / rajada (com plurais ICU) ---
move.burst.label=rajada
move.line=Jogada n.{0} -> {1}
move.joiner=+
move.valid={count, plural, =0 {} one {# tiro valido} other {# tiros validos}}
move.sunk={count, plural, one {# {type} ao fundo} other {# {typePlural} ao fundo}}
move.hits={count, plural, one {# tiro num(a) {type}} other {# tiros num(a) {type}}}
move.missed={count, plural, one {# tiro na agua} other {# tiros na agua}}
move.repeated={count, plural, one {# tiro repetido} other {# tiros repetidos}}
move.outside={count, plural, one {# tiro exterior} other {# tiros exteriores}}

# --- Tipos de navios (singular e plural) ---
ship.Barca=Barca
ship.Barca.plural=Barcas
ship.Nau=Nau
ship.Nau.plural=Naus
ship.Caravela=Caravela
ship.Caravela.plural=Caravelas
ship.Fragata=Fragata
ship.Fragata.plural=Fragatas
ship.Galeao=Galeao
ship.Galeao.plural=Galeoes

# --- Estado da frota ---
fleet.status=Estado da Frota: {floating} a flutuar, {sunk, plural, one {# afundado} other {# afundados}}!

# --- Fim de jogo ---
game.over.line1=+--------------------------------------------------------------+
game.over.message=| Maldito sejas, Java Sparrow, eu voltarei, glub glub glub ... |
game.over.line2=+--------------------------------------------------------------+
