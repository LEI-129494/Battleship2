# --- Application ---
app.title=***  Battleship  ***

# --- Menu commands (the user types these values) ---
cmd.help=help
cmd.newfleet=newfleet
cmd.loadfleet=loadfleet
cmd.status=status
cmd.map=map
cmd.shot=fire
cmd.shots=shots
cmd.simulate=simulate
cmd.simulate=simulate
cmd.exportpdf=exportpdf
cmd.quit=quit

# --- Menu: help ---
menu.prompt=> 
menu.help.title=========================== MENU HELP ===========================
menu.help.intro=Type one of the commands below to interact with the game:
menu.help.help=- {0}: Show this help.
menu.help.newfleet=- {0}: Generate a random fleet of ships.
menu.help.loadfleet=- {0}: Create and load a custom fleet.
menu.help.status=- {0}: Show the current status of the fleet.
menu.help.map=- {0}: Display the fleet map.
menu.help.shot=- {0}: Fire a burst of shots.
menu.help.simulate=- {0}: Simulate a full game.
menu.help.shots=- {0}: List the valid shots made (* = hit on ship, o = shot in water).
menu.help.exportpdf=- {0}: Export the move history to a PDF file.
menu.help.quit=- {0}: Quit the game.

menu.help.footer================================================================

# --- General messages ---
msg.goodbye=Fair winds!
msg.unknownCommand=What command is that??? Try again ...
msg.unknownShip=Unknown ship!
msg.shipAddFailure=Failed to create {0} {1} {2}
msg.shipsAdded={0} ships added successfully!
msg.pdfExported=PDF generated at: {0}
msg.noActiveGame=No active game. Create a fleet first.

# --- Input errors ---
error.incompletePosition=Incomplete position! Column ''{0}'' is not followed by a row.
error.invalidPositionCount=You must enter exactly {0} positions!
error.noValidPosition=No valid position found!
error.invalidPositionFormat=Invalid format. Use ''A3'', ''A 3'' or similar.
error.mustFireExactly=You must fire exactly {0} shots per move.
error.jsonSerialization=Error serializing JSON
error.jsonMoveSerialization=Error serializing the JSON of the move results
error.pdfExport=Error generating the PDF file.

# --- Board: legend ---
board.legend.title=          LEGEND
board.legend.symbols=''{0}''->ship, ''{1}''->adjacent to ship, ''{2}''->water
board.legend.shots=''{0}''->Direct hit, ''{1}''->Missed shot

# --- Shots / burst ---
move.line=Move #{0} -> {1}
move.burst.label=burst
move.joiner=+
move.valid={count, plural, =0 {} one {# valid shot} other {# valid shots}}
move.sunk={count, plural, one {# {type} sunk} other {# {typePlural} sunk}}
move.hits={count, plural, one {# hit on a {type}} other {# hits on a {type}}}
move.missed={count, plural, one {# shot in the water} other {# shots in the water}}
move.repeated={count, plural, one {# repeated shot} other {# repeated shots}}
move.outside={count, plural, one {# out-of-board shot} other {# out-of-board shots}}

# --- Ship types (singular and plural) ---
ship.Barca=Barge
ship.Barca.plural=Barges
ship.Nau=Carrack
ship.Nau.plural=Carracks
ship.Caravela=Caravel
ship.Caravela.plural=Caravels
ship.Fragata=Frigate
ship.Fragata.plural=Frigates
ship.Galeao=Galleon
ship.Galeao.plural=Galleons

# --- Fleet status ---
fleet.status=Fleet status: {floating} floating, {sunk, plural, one {# sunk} other {# sunk}}!

