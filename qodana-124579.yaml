# 124579 - Jaime Ferreira
version: "1.0"
linter: qodana-jvm-community
withinDocker: false
projectJDK: "21"

profile:
  base:
    name: empty

  inspections:
    - inspection: MethodCount
      enabled: true
      options:
        m_limit: 20
        ignoreGettersAndSetters: false
        ignoreOverridingMethods: false

    - inspection: ClassComplexity
      enabled: true
      options:
        m_limit: 80

failureConditions:
  severityThresholds:
    any: 0